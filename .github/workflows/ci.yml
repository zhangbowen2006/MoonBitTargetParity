name: MoonBit target parity CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  moonbit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Install MoonBit
        run: |
          curl -fsSL https://cli.moonbitlang.com/install/unix.sh | bash
          echo "$HOME/.moon/bin" >> "$GITHUB_PATH"

      - name: Show toolchain
        run: moon version --all

      - name: Resolve dependencies
        run: moon update

      - name: Check all backends
        run: moon check --target all --deny-warn

      - name: Build all backends
        run: moon build --target all

      - name: Test all backends
        run: moon test --target all --deny-warn

      - name: Format
        run: moon fmt --check

      - name: Public API snapshots
        run: |
          moon info
          git diff --exit-code -- '*.mbti'

      - name: CLI regression cases
        run: node scripts/test_cli.mjs

      - name: Live cross-target result comparison
        run: node scripts/check_backends.mjs

      - name: Package inspection
        run: moon package --list
